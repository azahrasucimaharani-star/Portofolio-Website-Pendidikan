<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor — Bimbelku</title><meta name="description" content="Kenali tutor dan program bimbel yang mereka ajar."><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/responsive.css"></head><body><div id="header"></div><main id="main"><header class="page-head"><div class="container"><span class="label">Tutor Bimbelku</span><h1>Membantu Siswa Memahami Konsep</h1><p>Tutor mendampingi siswa melalui penjelasan bertahap, latihan terarah, dan evaluasi yang dapat ditindaklanjuti.</p></div></header><section class="section container"><div class="tutor-grid" id="tutor-list"></div></section></main><div id="footer"></div><script type="module">import{shell,footer,tutorCard}from'./assets/js/main.js';import{tutors}from'./assets/js/data/tutors.js';import{programs}from'./assets/js/data/programs.js';document.querySelector('#header').innerHTML=shell();document.querySelector('#footer').innerHTML=footer();document.querySelector('#tutor-list').innerHTML=tutors.map(t=>tutorCard(t).replace('</div></article>',`<p><strong>Program yang diajar</strong></p><p>${t.programIds.map(id=>{const p=programs.find(x=>x.id===id);return `<a class="text-link" href="detail-program.html?id=${p.id}">${p.title}</a>`}).join('<br>')}</p></div></article>`)).join('')</script></body></html>
